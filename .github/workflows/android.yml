name: Android build

# An unsigned arm64 APK of this branch (feat/android-termux plus this workflow), for testing. Sign it before installing
# (`apksigner sign --ks <keystore> app-universal-release-unsigned.apk`).
on:
  push:
    branches: [android-apk]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # A test build: no LTO and parallel codegen, so it builds in a fraction of the release time.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 11 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
        with: { key: android, cache-on-failure: true }
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" pnpm exec tauri android build --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: openidea-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
